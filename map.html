<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JalTara Pit Map</title>

  <link rel="shortcut icon" type="image/png"
        href="https://images.squarespace-cdn.com/content/686b6207a7c996116ca9f6cc/0e917f42-0227-4261-8ad4-d14e1a1febab/%C2%A92_Save+Groundwater_icon_original_HD_png.png?content-type=image%2Fpng" />

  <!-- leaflet css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- markercluster css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- fullscreen css -->
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" />

  <!-- leaflet and markercluster js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- fullscreen js -->
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .leaflet-container {
      height: 800px;
      width: 1600px;
      max-width: 100%;
      max-height: 100%;
    }

    .invisible-cluster-icon {
      pointer-events: none; /* make the invisible icon unclickable */
    }
  </style>
</head>

<body>
  <div id="map" style="width: 1600px; height: 800px;"></div>

  <script>
    function toTitleCase(str) {
      str = str.split(' ');
      str = str.map(word => word.charAt(0).toUpperCase() + word.slice(1));
      return str.join(' ');
    }

    function clearMap() {
      // invalidate any pit loading still in progress
      activeLoadId++;

      // remove all currently displayed pits
      pitLayer.clearLayers();

      // restore the village marker that was hidden when opened
      if ( currentVillageMarker != null ) {
        if ( !villageLayer.hasLayer(currentVillageMarker) ) {
          villageLayer.addLayer(currentVillageMarker);
        }

        currentVillageMarker = null;
      }

      currentVillage = null;
      boundsZoom = null;
    }

    // default cluster icon style (is a function given cluster)
    const defaultClusterIcon = function(cluster) {
      return L.divIcon({
        html: `<div style="
                  background:#009C9D;
                  color:white;
                  border-radius:50%;
                  border: 1px solid #004E4F;
                  width:40px;
                  height:40px;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-family: 'Courier New', monospace;
                  font-size:14px;">
                     ${cluster.getChildCount()}
                   </div>`,
        className: "village-cluster-icon",
        iconSize: [40, 40]
      });
    };

    // marker style that looks like cluster
    const clusterStyleIcon = L.divIcon({
      html: `<div style="
               background:#009C9D;
               color:white;
               border-radius:50%;
               border: 1px solid #004E4F;
               width:40px;
               height:40px;
               display:flex;
               align-items:center;
               justify-content:center;
               font-family: 'Courier New', monospace;
               font-size:14px;">
               1
             </div>`,
      className: "village-cluster-icon",
      iconSize: [40, 40]
    });

    // village markers
    const villageMarkerIcon = function(pitsNum) {
      return L.divIcon({
        html: `<div style="
                 background:#009C9D;
                 color:white;
                 border-radius:50%;
                 border: 1px solid #004E4F;
                 width:40px;
                 height:40px;
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 font-family: 'Courier New', monospace;
                 font-size:14px;">
                 ${pitsNum}
               </div>`,
        className: "village-marker-icon",
        iconSize: [40, 40]
      });
    };

    // icon style after expanding
    const expandedMarkerIcon = L.divIcon({
      html: `<div style="
               background:#80CECE;
               border-radius:50%;
               border: 1px solid #009C9D;
               width:15px;
               height:15px;">
             </div>`,
      className: "expanded-marker-icon",
      iconSize: [15, 15]
    });

    // invisible icon to hide things
    const invisibleClusterIcon = L.divIcon({
      html: `<div style="
               width:1px;
               height:1px;
               background-color: rgba(0,0,0,0);
             "></div>`,
      className: "invisible-cluster-icon",
      iconSize: [1, 1]
    });

    const map = L.map('map', {
      center: [19.84529409208099, 76.27065167353523],
      zoom: 5,
      minZoom: 2,
      maxZoom: 18,
      worldCopyJump: false, // prevent snapping across worlds
      maxBounds: [
        [-90, -180], // southwest corner
        [90, 180] // northeast corner
      ],
      fullscreenControl: true
    });

    // base layers
    const satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
    ).addTo(map);

    const street = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap contributors', maxZoom: 19 }
    );

    const labels = L.tileLayer(
      'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Labels &copy; Esri', maxZoom: 19 }
    ).addTo(map);

    // toggle map view control
    const ToggleControl = L.Control.extend({
      onAdd: function(map) {
        const btn = L.DomUtil.create('button', '');
        let current = 'satellite';

        btn.innerHTML = "Street View";
        btn.style.backgroundColor = 'white';
        btn.style.padding = '5px';
        btn.style.cursor = 'pointer';
        btn.style.border = '1px solid gray';

        btn.onclick = function() {
          if ( current == 'satellite' ) {
            map.removeLayer(satellite);
            street.addTo(map);
            current = 'street';
            btn.innerHTML = "Satellite View";
          } else {
            map.removeLayer(street);
            satellite.addTo(map);
            current = 'satellite';
            btn.innerHTML = "Street View";
          }
        };

        return btn;
      }
    });

    new ToggleControl({ position: 'topright' }).addTo(map);

    // bounds and cluster storage
    let minLat = Infinity, maxLat = -Infinity;
    let minLon = Infinity, maxLon = -Infinity;
    let clusters = {};

    // marker click global vars
    let boundsZoom = null;
    const expandedMarkers = [];

    // cluster click global vars
    let currentUnclusteredMarkers = null;
    let currentCluster = null;
    let currentClusterGroup = null;

    // create temporary village markers layer
    const villageLayer = L.layerGroup().addTo(map);

    // store village data and dataset version
    let villageData = [];
    let datasetVersion = '';

    // cache pit files after they are fetched
    const pitCache = new Map();

    // layer for currently displayed pits
    const pitLayer = L.layerGroup().addTo(map);

    // create the pit canvas renderer only when a village is opened
    let pitRenderer = null;

    // prevents an older click from overwriting a newer click
    let activeLoadId = 0;

    // store the currently opened village and its hidden marker
    let currentVillage = null;
    let currentVillageMarker = null;

    // convert stored village bounds into leaflet bounds
    function getVillageBounds(village) {
      if ( !village.bounds ) {
        return null;
      }

      const minLat = Number(village.bounds.minLat);
      const maxLat = Number(village.bounds.maxLat);
      const minLon = Number(village.bounds.minLon);
      const maxLon = Number(village.bounds.maxLon);

      if (
        !Number.isFinite(minLat) ||
        !Number.isFinite(maxLat) ||
        !Number.isFinite(minLon) ||
        !Number.isFinite(maxLon)
      ) {
        return null;
      }

      return L.latLngBounds(
        [minLat, minLon],
        [maxLat, maxLon]
      );
    }

    // fetch one village's pit file and cache it
    function loadVillagePits(village) {
      if ( !village.pitFile ) {
        return Promise.resolve([]);
      }

      if ( pitCache.has(village.pitFile) ) {
        return pitCache.get(village.pitFile);
      }

      const url =
        `https://raw.githubusercontent.com/savegroundwater/jaltara/main/data/pits_by_village/${village.pitFile}?v=${encodeURIComponent(datasetVersion)}`;

      const request = fetch(url)
        .then(res => {
          if ( !res.ok ) {
            throw new Error(
              `failed to load pits for ${village.name}: ${res.status}`
            );
          }

          return res.json();
        })
        .catch(error => {
          pitCache.delete(village.pitFile);
          throw error;
        });

      pitCache.set(village.pitFile, request);

      return request;
    }

    // create the popup shown for an individual pit
    function createPitPopup(pit, villageName) {
      let popupContent = '<div style="text-align:center;">';

      if ( pit.image && pit.image !== '--' ) {
        popupContent += `
          <div style="width:150px; height:150px; overflow:hidden; margin:0 auto;">
            <img
              src="${pit.image}"
              style="width:150px; height:150px; object-fit:cover;"
            >
          </div><br>
        `;
      }

      if ( villageName && villageName !== '--' ) {
        popupContent += `<strong>Village:</strong> ${villageName}<br>`;
      }

      if ( pit.date && pit.date !== '--' ) {
        popupContent += `<strong>Date:</strong> ${pit.date}`;
      }

      popupContent += '</div>';

      return popupContent;
    }

    // load and display pits for a clicked village
    async function openVillage(village, villageMarker) {
      const clickedBounds = getVillageBounds(village);

      if ( !clickedBounds ) {
        console.error(`no valid bounds found for ${village.name}`);
        return;
      }

      // close any previously opened village first
      clearMap();

      currentVillage = village;
      currentVillageMarker = villageMarker;

      // hide the clicked village marker while its pits are open
      villageMarker.closePopup();
      villageLayer.removeLayer(villageMarker);

      const loadId = ++activeLoadId;

      // find villages whose pit bounds overlap the clicked village
      const nearbyVillages = villageData.filter(candidate => {
        if ( !candidate.pitFile ) {
          return false;
        }

        const candidateBounds = getVillageBounds(candidate);

        if ( !candidateBounds ) {
          return false;
        }

        return clickedBounds.intersects(candidateBounds);
      });

      try {
        // only fetch pit files for villages that could contain relevant pits
        const loadedVillages = await Promise.all(
          nearbyVillages.map(async candidate => {
            const pits = await loadVillagePits(candidate);

            return {
              village: candidate,
              pits: pits
            };
          })
        );

        // ignore this result if another village was clicked while loading
        if ( loadId !== activeLoadId ) {
          return;
        }

        loadedVillages.forEach(result => {
          result.pits.forEach(pit => {
            const pitLat = Number(pit.lat);
            const pitLon = Number(pit.lon);

            if (
              !Number.isFinite(pitLat) ||
              !Number.isFinite(pitLon)
            ) {
              return;
            }

            // always include the clicked village's pits
            // only include neighboring village pits inside the clicked bounds
            const shouldDisplay =
              result.village.name === village.name ||
              clickedBounds.contains([pitLat, pitLon]);

            if ( !shouldDisplay ) {
              return;
            }

            // use canvas for pit dots when available
            if ( pitRenderer == null && typeof L.canvas === 'function' ) {
              pitRenderer = L.canvas({ padding: 0.5 });
            }

            const markerOptions = {
              radius: 7,
              color: '#009C9D',
              weight: 1,
              opacity: 1,
              fillColor: '#80CECE',
              fillOpacity: 1
            };

            if ( pitRenderer != null ) {
              markerOptions.renderer = pitRenderer;
            }

            const marker = L.circleMarker(
              [pitLat, pitLon],
              markerOptions
            );

            marker.bindPopup(
              createPitPopup(pit, result.village.name)
            );

            marker.on('mouseover', function() {
              this.openPopup();
            });

            marker.on('mouseout', function() {
              this.closePopup();
            });

            // clicking any expanded pit closes the current village
            marker.on('click', function() {
              clearMap();
            });

            marker.addTo(pitLayer);
          });
        });

        // store the zoom level so zooming back out closes the village
        boundsZoom = Math.min(
          map.getBoundsZoom(clickedBounds),
          18
        );

        // zoom to the clicked village's pit bounds
        map.flyToBounds(
          clickedBounds,
          {
            padding: [50, 50],
            maxZoom: 18,
            animate: true,
            duration: 0.5
          }
        );

      } catch (error) {
        console.error(
          `failed to open ${village.name}:`,
          error
        );

        clearMap();
      }
    }

    // close the open village if the user zooms back out
    map.on('zoomend', function() {
      if (
        boundsZoom != null &&
        map.getZoom() < (boundsZoom - 1)
      ) {
        clearMap();
      }
    });

    // fetch lightweight village index
    fetch(
      `https://raw.githubusercontent.com/savegroundwater/jaltara/main/data/village_index.json?t=${Date.now()}`,
      { cache: 'no-store' }
    )
      .then(res => {
        if ( !res.ok ) {
          throw new Error(`failed to load village index: ${res.status}`);
        }

        return res.json();
      })
      .then(data => {
        datasetVersion = data.version || '';
        villageData = data.villages || [];

        villageData.forEach(village => {
          const villageLat = Number(village.lat);
          const villageLon = Number(village.lon);

          if ( !Number.isFinite(villageLat) || !Number.isFinite(villageLon) ) {
            return;
          }

          // track overall map bounds
          minLat = Math.min(minLat, villageLat);
          maxLat = Math.max(maxLat, villageLat);
          minLon = Math.min(minLon, villageLon);
          maxLon = Math.max(maxLon, villageLon);

          // use the actual number of valid pits
          const villagePitsNum =
            village.actualPitCount ?? village.pitCount ?? 0;

          // create village popup
          const villagePopup =
            `<strong>Village:</strong> ${village.name}<br>`;

          // create village marker
          const marker = L.marker(
            [villageLat, villageLon],
            { icon: villageMarkerIcon(villagePitsNum) }
          );

          marker.villageData = village;
          marker.bindPopup(villagePopup);

          marker.on('mouseover', function() {
            this.openPopup();
          });

          marker.on('mouseout', function() {
            this.closePopup();
          });

          marker.on('click', function() {
            openVillage(village, marker);
          });

          marker.addTo(villageLayer);
        });

        // fit map around all villages
        if (
          Number.isFinite(minLat) &&
          Number.isFinite(maxLat) &&
          Number.isFinite(minLon) &&
          Number.isFinite(maxLon)
        ) {
          const bounds = L.latLngBounds(
            L.latLng(minLat - 1, minLon - 1),
            L.latLng(maxLat + 1, maxLon + 1)
          );

          map.fitBounds(bounds);
        }
      })
      .catch(error => {
        console.error('failed to load village data:', error);
      });

  </script>
</body>
</html>
